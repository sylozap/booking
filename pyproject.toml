# Workspace root. Not an installable package itself (`tool.uv.package = false`):
# it only aggregates the workspace members so that `uv sync` provisions a single
# environment containing every service and the chassis.
[project]
name = "booking-platform"
version = "0.1.0"
description = "SaaS online booking platform: multi-tenant, event-driven microservices."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chassis",
    "identity",
    "catalog",
    "booking",
    "payment",
    "notification",
]

[dependency-groups]
dev = [
    "httpx>=0.28",         # ASGI transport for the FastAPI test client
    "httpx2>=2.12",        # what starlette's test client uses; without it every run warns
    "import-linter>=2.1",  # layer boundaries (CODING_STANDARDS 2.2)
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/chassis", "services/*"]

[tool.uv.sources]
chassis = { workspace = true }
identity = { workspace = true }
catalog = { workspace = true }
booking = { workspace = true }
payment = { workspace = true }
notification = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs/chassis/src", "services/*/src", "services/*/tests", "tests"]

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ANN",   # missing annotations (CODING_STANDARDS 4)
    "ARG",   # unused arguments
    "ASYNC", # blocking calls in coroutines (CODING_STANDARDS 13)
    "B",     # bugbear
    "BLE",   # blind except (CODING_STANDARDS 11)
    "C4",    # comprehensions
    "DTZ",   # naive datetime (D13)
    "E",     # pycodestyle errors
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FBT",   # boolean trap
    "I",     # import sorting
    "INP",   # implicit namespace packages
    "N",     # naming (CODING_STANDARDS 3)
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "Q",     # quotes
    "RET",   # return simplification
    "RUF",   # ruff-specific
    "S",     # bandit
    "SIM",   # simplification
    "T20",   # print (CODING_STANDARDS 11)
    "TD",    # TODO hygiene
    "TID",   # import discipline (CODING_STANDARDS 2.2)
    "TRY",   # exception handling
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "TD002",  # TODO author is redundant: git blame already records it.
    "TRY003", # Message text at the raise site is more readable than a message class.
]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only: the layer a symbol comes from must be visible in the
# import line itself (CODING_STANDARDS 1, 2.2).
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # Literal expected values are the point of a test.
    "S101",    # assert is how tests assert.
]
"**/tests/**/*.py" = [
    "PLR2004",
    "S101",
    # A service's tests are a test root, not a package. Adding __init__.py
    # would name every service's suite `tests`, and two of them cannot be
    # imported into the same run.
    "INP001",
]
"**/domain/exceptions.py" = [
    # CODING_STANDARDS 6 names a domain error after the rule it violates
    # (SlotAlreadyTaken), not with an Error suffix: the catalogue reads as a
    # list of things that can go wrong, which is what it is.
    "N818",
]
"**/migrations/**/*.py" = [
    "ANN",   # Alembic revision templates are generated.
    "INP001",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# CODING_STANDARDS 4: `Any` is banned; use `object` plus explicit narrowing.
disallow_any_explicit = true
disallow_any_unimported = true
enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "libs/chassis/src",
    "services/booking/src",
    "services/catalog/src",
    "services/identity/src",
    "services/notification/src",
    "services/payment/src",
]
files = ["libs", "services", "tests"]

# CODING_STANDARDS 2.2: the layer rules are checked by a linter, not by
# agreement. Every contract here restates one row of that table.
[tool.importlinter]
root_packages = ["identity", "catalog", "booking", "payment", "notification", "chassis"]
# Required to name third-party packages in a forbidden contract.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "identity: dependencies point inward"
type = "layers"
# api and infrastructure are siblings, not stacked: api reaches infrastructure
# only through a port declared in application, and the composition root
# (identity.main, deliberately outside every layer) is what connects them.
layers = [
    "identity.api | identity.infrastructure",
    "identity.application",
    "identity.domain",
]

[[tool.importlinter.contracts]]
name = "identity: domain knows nothing of infrastructure"
type = "forbidden"
source_modules = ["identity.domain"]
# The point of the rule is that domain tests need no database, no broker and no
# network. A pydantic import in domain is the first step to a validator that
# needs one.
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "redis",
    "opentelemetry",
    "prometheus_client",
]

[[tool.importlinter.contracts]]
name = "services never import each other"
type = "independence"
# D7: between services there are events and HTTP contracts, nothing else.
modules = ["identity", "catalog", "booking", "payment", "notification"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests", "libs", "services"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
