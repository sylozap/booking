# The first application to go through the loop, and the one that proves the
# encrypted-secret path works end to end: the file in git is unreadable, what
# lands in the cluster is a plain Secret (D52).
#
# The repoURL is literal. ArgoCD reads this file from git, so nothing is left
# to substitute it — unlike the root Application, which a human applies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: booking

  source:
    repoURL: https://github.com/sylozap/booking.git
    targetRevision: main
    path: deploy/k8s/base/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
