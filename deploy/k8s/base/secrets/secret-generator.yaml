# KSOPS is a kustomize exec plugin: kustomize hands it the encrypted files and
# receives decrypted manifests back. It runs where manifests are rendered —
# the ArgoCD repo-server, which holds the age key — and never in CI.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: booking-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - placeholder.enc.yaml
