# Deliberately not referenced by ../kustomization.yaml, and so not part of any
# overlay: rendering this directory requires the KSOPS plugin and the age
# private key. Pulling it into the overlays would mean `kustomize build` — and
# therefore CI — could not run without the key, which is the one place the key
# must never be (D52).
#
# ArgoCD deploys it as its own Application (deploy/argocd/apps/secrets.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - secret-generator.yaml
