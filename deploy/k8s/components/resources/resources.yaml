# No CPU limit on purpose: a CPU limit throttles a service that has idle cores
# available to it, which shows up as latency the dashboards cannot explain.
# The memory limit stays, because memory is not compressible.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeholder
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
