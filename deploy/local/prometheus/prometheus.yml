global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules arrive in phase 7, when there are thresholds to assert against
# the targets from ADR-0012.
rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Service metrics reach Prometheus through the collector, not by scraping
  # each service directly.
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: otel-collector-internal
    static_configs:
      - targets: ['otel-collector:8888']
