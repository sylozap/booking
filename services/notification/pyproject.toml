[project]
name = "notification"
version = "0.1.0"
description = "Notification delivery: email, SMS and push adapters."
requires-python = ">=3.12,<3.13"
dependencies = ["chassis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]
