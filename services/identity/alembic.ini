# Alembic for the identity service. One history per service, in that service's
# own directory: there is no shared schema and no cross-database access (D19),
# so a single global history would be a coupling that the databases themselves
# do not have.
#
# sqlalchemy.url is deliberately absent. The connection string is configuration
# and comes from the environment through pydantic-settings like every other
# setting (D54); env.py reads it there. A URL here would be a second, silently
# different source of truth — and the one that gets used by accident.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Sequential revision ids: 0001_enable_extensions reads as an ordered history,
# a hash does not. With one writer per service there is no branching to fear.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

# Migrations run as a PreSync Job with a fixed timezone-free clock; timestamps
# in file names would only add churn to diffs.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
