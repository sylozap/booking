[project]
name = "booking"
version = "0.1.0"
description = "Schedule, availability, bookings and the payment saga orchestration."
requires-python = ">=3.12,<3.13"
dependencies = ["chassis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]
